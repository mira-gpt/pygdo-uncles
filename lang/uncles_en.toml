msg_unclegame = "WeChall Card Clash: start with $unclemob — it gives you a card if needed and fights a mob. $uncles shows your deck; $uncle <user> <card> challenges a player; $unclemob [card] fights a lower-card mob; $unclecard <card> inspects a card. One of eight stats is chosen against its paired defence. Lower rank wins ties more often. A human winner takes the losing card; a mob win drops its card. Empty decks receive a random rank 1–50 card."
